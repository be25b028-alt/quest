<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Reflection</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #000000;
      --panel: #111111;
      --panel-strong: #1f1f1f;
      --text: #ffffff;
      --muted: #d8d8d8;
      --border: rgba(255, 255, 255, 0.08);
      --shadow: rgba(0, 0, 0, 0.55);
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
      margin: 0;
      background-color: var(--bg);
      background-image: linear-gradient(rgba(0, 0, 0, 0.92), rgba(0, 0, 0, 0.92)),
        url('https://i.programmerhumor.io/2025/10/0181fcfef4a4b6591eb84e442d2cf3a65ffd8d805683fc86a6ba777b408b9bd5.jpeg');
      background-repeat: no-repeat;
      background-position: center center;
      background-size: cover;
      color: var(--text);
      min-height: 100vh;
    }

    .page {
      width: min(1200px, 100%);
      margin: 0 auto;
      padding: 40px 48px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .brand h1 {
      margin: 0;
      font-size: 2.3rem;
      letter-spacing: -0.04em;
    }

    .brand p {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .hero {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 32px;
      margin-top: 48px;
    }

    .hero-text {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 24px;
    }

    .hero-text h2 {
      margin: 0;
      font-size: 2.8rem;
      line-height: 1.05;
    }

    .hero-text p {
      margin: 0;
      color: var(--muted);
      max-width: 680px;
      font-size: 1.05rem;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 32px;
      padding: 36px;
      box-shadow: 0 28px 90px var(--shadow);
    }

    .panel h3 {
      margin-top: 0;
      margin-bottom: 18px;
      font-size: 1.5rem;
    }

    .panel p {
      margin: 0 0 32px;
      color: var(--muted);
      line-height: 1.8;
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-weight: 700;
      color: var(--text);
    }

    textarea {
      width: 100%;
      min-height: 112px;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: #090909;
      color: var(--text);
      resize: vertical;
      font-size: 1rem;
      line-height: 1.6;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    textarea:focus {
      outline: none;
      border-color: #ffffff;
      box-shadow: 0 0 0 4px rgba(255,255,255,0.08);
    }

    textarea::placeholder {
      color: rgba(255,255,255,0.38);
    }

    .question {
      margin-bottom: 28px;
    }

    .button-row {
      display: flex;
      justify-content: flex-start;
    }

    button {
      background: #ffffff;
      color: #000000;
      border: none;
      border-radius: 14px;
      padding: 16px 30px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 18px 40px rgba(0,0,0,0.16);
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 22px 48px rgba(0,0,0,0.24);
    }

    .thanks {
      margin-top: 28px;
      padding: 22px;
      background: #111111;
      border-radius: 18px;
      border: 1px solid var(--border);
      color: var(--muted);
      display: none;
    }

    .thanks strong {
      display: block;
      margin-bottom: 6px;
      color: var(--text);
    }

    @media (max-width: 980px) {
      .hero {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 640px) {
      .page {
        padding: 24px;
      }
      .brand h1 {
        font-size: 2rem;
      }
      .hero-text h2 {
        font-size: 2.2rem;
      }
      .panel {
        padding: 28px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="brand">
        <h1>Reflection</h1>
        <p>Your Idea</p>
      </div>
      <div>: ) vivek Meena</div>
    </header>

    <section class="hero">
      <div class="hero-text">
        <h2>your simplest MVP.</h2>
      </div>
      <aside class="panel">
        <h3>Start your reflection</h3>
        <p>Write clearly. Keep the answers concise. Submit your response to save it instantly.</p>
        <form id="reflectionForm">
          <div class="question">
            <label for="problem">1. What is one problem you face?</label>
            <textarea id="problem" name="problem" placeholder="Describe one problem you face..." required></textarea>
          </div>
          <div class="question">
            <label for="solution">2. What is the first simple solution?</label>
            <textarea id="solution" name="solution" placeholder="Write the first simple solution..." required></textarea>
          </div>
          <div class="question">
            <label for="mvp">3. What would your MVP look like?</label>
            <textarea id="mvp" name="mvp" placeholder="Describe your MVP or smallest test..." required></textarea>
          </div>
          <div class="button-row">
            <button type="submit">Submit Answers</button>
          </div>
        </form>
        <div class="thanks" id="thanksMessage">
          <strong>Thanks for sharing!</strong>
          <p>Your answers have been recorded. Keep experimenting with your idea.</p>
        </div>
      </aside>
    </section>
  </div>
  <script>
    const SHEET_URL = 'https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec';

    async function saveToSheet(data) {
      const response = await fetch(SHEET_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify(data),
      });

      if (!response.ok) {
        throw new Error(`Server returned ${response.status}`);
      }

      return response.json();
    }

    document.getElementById('reflectionForm').addEventListener('submit', async function(event) {
      event.preventDefault();

      const formData = {
        problem: document.getElementById('problem').value.trim(),
        solution: document.getElementById('solution').value.trim(),
        mvp: document.getElementById('mvp').value.trim(),
        timestamp: new Date().toISOString(),
      };

      try {
        await saveToSheet(formData);
        document.getElementById('thanksMessage').style.display = 'block';
        this.reset();
      } catch (error) {
        console.error('Save failed:', error);
        alert('Unable to save your response right now. Please try again later.');
      }
    });
  </script>
</body>
</html>
